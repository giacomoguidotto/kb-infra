# PROTOTYPE: required pull-request check in the future bundle repository.
name: Guard Generated Bundle

on:
  pull_request:

permissions:
  contents: read

jobs:
  reject-manual-generated-edits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Generated surfaces are CI-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(skills/|provenance\.lock\.json$)'; then
            echo "skills/ and provenance.lock.json are generated by reconcile.yml"
            exit 1
          fi
