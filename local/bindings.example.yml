# Copy to local/bindings.yml (gitignored) and fill in.
# `setup-kb-infra` writes and rebuilds this file; treat it as replaceable.

provider:
  name: notion # your KB provider
  connector: notion-mcp # how the harness reaches it
  hint: "" # optional root page/db to start exploration from

# Where each endpoint lives in YOUR KB.
# Leave blank to let lookup resolve it by meaning at run time.
endpoints:
  selected-projects: ""
  public-safe-claim-source: ""
  proof-points: ""
  network: ""
  identity: ""
  point-of-view: ""
  published-social-context: ""
  portfolio-change-rules: ""
  social-rules-of-engagement: ""
  job-search-strategy: ""
  personal-constraints: ""
  signal-preferences: ""

# External read sources automations observe (never write).
# Knowledge Harvest mines these for signals; blank/empty = none.
sources:
  transcript-source: [] # list of agent transcript locations on this machine
  # Your own public profiles, one per platform. Knowledge Harvest reads them
  # best-effort to reconcile published-social-context. Blank = skip that platform
  # (Harvest falls back to asking you what went out).
  social-profile-source:
    x: "" # e.g. https://x.com/<handle>
    linkedin: "" # e.g. https://www.linkedin.com/in/<handle>/recent-activity/all/

# External systems automations materialize into.
sinks:
  career-system:
    repo: ""
    clone: ""
    enabled: false
  portfolio:
    repo: ""
    clone: ""
    enabled: false
  social-draft-queue:
    tool: "" # e.g. typefully
    enabled: false

# Automation cadences (local timezone).
cadences:
  timezone: ""
  knowledge-harvest: ""
  social-draft-pulse: ""
  portfolio-surface-sweep: ""
  job-hunt-evaluate-audit: ""
  job-hunt-advance-audit: ""

# Overrides for repo defaults (optional; blank = use repo default).
overrides:
  follow-up-marker-policy: ""
  draft-style: "" # blank = shipped Notion-style palette; else describe your restyle
