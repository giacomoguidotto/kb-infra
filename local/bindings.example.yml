# Copy to local/bindings.yml (gitignored) and fill in.
# `setup-kb-infra` writes and rebuilds this file; treat it as replaceable.

provider:
  name: notion # your KB provider
  connector: notion-mcp # how the harness reaches it
  hint: "" # optional root page/db to start exploration from

# Where each endpoint lives in YOUR KB.
# Leave blank to let lookup resolve it by meaning at run time.
endpoints:
  selected-projects: ""
  public-safe-claim-source: ""
  proof-points: ""
  network: ""
  identity: ""
  point-of-view: ""
  published-social-context: ""
  portfolio-change-rules: ""
  social-rules-of-engagement: ""
  job-search-strategy: ""
  communication-strategy: "" # optional; sink generic defaults remain complete
  personal-constraints: ""
  signal-preferences: ""

# External read sources automations observe (never write).
# Knowledge Harvest mines these for signals; blank/empty = none.
sources:
  transcript-source: [] # list of agent transcript locations on this machine
  # Your own public profiles, one per platform. Knowledge Harvest reads them
  # best-effort to reconcile published-social-context. Blank = skip that platform
  # (Harvest falls back to asking you what went out).
  social-profile-source:
    x: "" # e.g. https://x.com/<handle>
    linkedin: "" # e.g. https://www.linkedin.com/in/<handle>/recent-activity/all/
  # The bound social publishing system's read side. Concrete account values and
  # native read instructions stay local; blank capabilities are hard gaps when an
  # enabled automation declares them.
  social-publishing-source:
    tool: ""
    account: ""
    platforms: []
    capabilities:
      publication-history: ""
      post-analytics: ""
      queue-timeline: ""
      queue-schedule: ""
  # Private, read-only availability evidence. Event details constrain scheduling
  # only and never become social content.
  availability-calendar-source:
    calendar: ""
    access: read-only
    capabilities:
      upcoming-availability: ""
  # Public, time-sensitive research used to understand current discourse before
  # social candidate generation. It never supplies the user's stance by itself.
  external-signal-source:
    tool: ""
    scope: ""
    capabilities:
      current-public-signals: ""

# External systems automations materialize into.
sinks:
  career-system:
    repo: ""
    clone: ""
    enabled: false
    capabilities:
      advance-workflow: "" # sink-native next-work orchestration contract
      wait-review: "" # sink-native review of externally owned waits and next routes
      related-opportunity-selector: "" # deterministic pre-ranking command/workflow
  portfolio:
    repo: ""
    clone: ""
    enabled: false
  social-draft-queue:
    tool: "" # concrete tool handle plus approval-gated scheduling instructions
    enabled: false

# Concrete harness choices resolved from the provider-agnostic execution profiles.
models:
  knowledge-harvest:
    model: ""
    reasoning_effort: ""
  social-draft-pulse:
    model: ""
    reasoning_effort: ""
  portfolio-surface-sweep:
    model: ""
    reasoning_effort: ""
  job-hunt-evaluate-audit:
    model: ""
    reasoning_effort: ""
  job-hunt-advance-audit:
    model: ""
    reasoning_effort: ""

# Automation cadences (local timezone).
cadences:
  timezone: ""
  knowledge-harvest: ""
  social-draft-pulse: ""
  portfolio-surface-sweep: ""
  job-hunt-evaluate-audit: ""
  job-hunt-advance-audit: ""

# Overrides for repo defaults (optional; blank = use repo default).
overrides:
  follow-up-marker-policy: ""
  draft-style: "" # blank = shipped Notion-style palette; else describe your restyle
