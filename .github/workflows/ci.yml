name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Spec & Patch Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate spec
        run: bash scripts/check.sh

      - name: Check patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            git diff --check FETCH_HEAD...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --root HEAD
          fi

  version:
    name: Tag Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]

    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: bash scripts/bump-version.sh

      - name: Push tag
        if: steps.bump.outputs.tag
        run: git push origin "${{ steps.bump.outputs.tag }}"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.version.outputs.tag
    needs: [version]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --generate-notes

      - name: Verify stable immutable release
        id: source-release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          release=$(gh api "repos/${{ github.repository }}/releases/tags/$SOURCE_TAG")
          jq -e \
            --arg tag "$SOURCE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' \
            <<<"$release" >/dev/null
          {
            echo "release_id=$(jq -r '.id' <<<"$release")"
            echo "tag=$(jq -r '.tag_name' <<<"$release")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Trigger App configuration
        env:
          TRIGGER_APP_ID: ${{ vars.DISTRIBUTION_TRIGGER_APP_ID }}
          TRIGGER_APP_PRIVATE_KEY: ${{ secrets.DISTRIBUTION_TRIGGER_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$TRIGGER_APP_ID" ]; then
            echo "::error::DISTRIBUTION_TRIGGER_APP_ID is not configured."
            exit 1
          fi
          if [ -z "$TRIGGER_APP_PRIVATE_KEY" ]; then
            echo "::error::DISTRIBUTION_TRIGGER_APP_PRIVATE_KEY is not configured."
            exit 1
          fi

      - name: Mint target-scoped Trigger token
        id: distribution-trigger
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.DISTRIBUTION_TRIGGER_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_TRIGGER_APP_PRIVATE_KEY }}
          owner: giacomoguidotto
          repositories: skills
          permission-actions: write

      - name: Wake Distribution Bundle reconciliation
        env:
          GH_TOKEN: ${{ steps.distribution-trigger.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RELEASE_ID: ${{ steps.source-release.outputs.release_id }}
          SOURCE_TAG: ${{ steps.source-release.outputs.tag }}
        run: |
          gh api --method POST \
            repos/giacomoguidotto/skills/actions/workflows/reconcile.yml/dispatches \
            --raw-field ref=main \
            --raw-field "inputs[source_repository]=$SOURCE_REPOSITORY" \
            --raw-field "inputs[source_release_id]=$SOURCE_RELEASE_ID" \
            --raw-field "inputs[source_tag]=$SOURCE_TAG"
